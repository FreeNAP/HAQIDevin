name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/mobile/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install deps
        working-directory: packages/mobile
        run: npm install --legacy-peer-deps
      # 注意: 不要用 expo install --fix — 它会把 reanimated 的 exact 锁版改回 ^ 范围,
      # 解析到与 RN 0.85 不兼容的 4.8+。依赖版本已在仓库 package.json/lock 中对齐。
      - name: Verify expo deps aligned
        working-directory: packages/mobile
        run: npx expo install --check
        env:
          CI: '1'
      - name: Prebuild android
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HAQIDevin-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk
